<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Designs India Pvt Ltd - Architectural, BIM & Surveying Solutions</title>
    <style>
        :root {
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --primary-glow: rgba(56, 189, 248, 0.25);
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; scroll-behavior: smooth; }
        body { background: var(--bg-dark); color: #f8fafc; line-height: 1.6; overflow-x: hidden; }
        
        .header-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        /* Top Bar - Bright White Text & Tech Cyan Icons */
        .top-bar {
            background: #020617;
            padding: 9px 5%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 25px;
            font-size: 13.5px;
            border-bottom: 1px solid #1e293b;
        }
        .top-bar a {
            color: #ffffff !important;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: 0.3s;
        }
        .top-bar a .top-icon {
            color: var(--primary);
            font-size: 14px;
        }
        .top-bar a:hover {
            color: var(--primary) !important;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(12px);
            padding: 12px 5%; 
            border-bottom: 1px solid #1e293b; 
        }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-area img { height: 42px; width: auto; object-fit: contain; }
        
        /* Middle Centered Logo Lockup */
        .logo-text-group { 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            text-align: center;
        }
        .logo-area .company-title { 
            color: var(--primary); 
            font-size: 19px; 
            font-weight: 800; 
            letter-spacing: 0.5px; 
            line-height: 1.2; 
            display: block;
            text-align: center;
        }
        .logo-area .company-tagline { 
            color: #f1f5f9 !important; 
            font-size: 8.5px !important; 
            font-weight: 600 !important; 
            letter-spacing: 2.8px !important; 
            text-transform: uppercase; 
            margin-top: 3px;
            display: block;
            text-align: center;
            opacity: 0.9;
            width: 100%;
        }
        
        nav ul { list-style: none; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
        nav ul li a { color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.3s; }
        nav ul li a:hover { color: var(--primary); }
        .portal-btn { 
            background: var(--primary) !important; 
            color: #0f172a !important; 
            padding: 7px 16px; 
            border-radius: 6px; 
            font-weight: 700; 
            transition: 0.3s;
        }
        .portal-btn:hover {
            background: var(--primary-hover) !important;
            transform: translateY(-2px);
        }

        header { 
            position: relative;
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 140px 20px 50px; 
            overflow: hidden;
        }
        .hero-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(15,23,42,0.82), rgba(15,23,42,0.95));
            z-index: 2;
        }
        .hero-content {
            position: relative;
            z-index: 3;
            max-width: 900px;
        }
        header h1 { 
            font-size: 42px; 
            color: #ffffff !important; 
            margin-bottom: 16px; 
            font-weight: 800; 
            letter-spacing: 0.8px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        header .sub-desc { 
            font-size: 16px; 
            color: #94a3b8; 
            margin-bottom: 30px; 
            max-width: 750px; 
            margin-left: auto; 
            margin-right: auto; 
        }
        .btn { 
            background: var(--primary); 
            color: #0f172a; 
            padding: 12px 32px; 
            border-radius: 6px; 
            font-weight: 700; 
            text-decoration: none; 
            transition: 0.3s; 
            display: inline-block; 
            box-shadow: 0 4px 15px var(--primary-glow);
        }
        .btn:hover { 
            background: var(--primary-hover); 
            transform: translateY(-2px); 
        }

        section { padding: 85px 6%; }
        .section-title { 
            text-align: center; 
            font-size: 32px; 
            margin-bottom: 40px; 
            color: #fff; 
            font-weight: 700; 
        }

        .about-box {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 12px;
            max-width: 850px;
            margin: 0 auto;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .about-box p {
            font-size: 17px;
            color: #cbd5e1;
            line-height: 1.8;
        }

        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .service-card { background: var(--card-bg); padding: 32px; border-radius: 12px; border: 1px solid #334155; transition: 0.3s; }
        .service-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 25px var(--primary-glow); }
        .service-card h3 { font-size: 21px; margin-bottom: 15px; color: #fff; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .service-card p { color: #94a3b8; font-size: 14px; margin-bottom: 12px; }
        .service-card ul { list-style: disc; padding-left: 20px; color: #cbd5e1; font-size: 14px; }
        .service-card ul li { margin-bottom: 6px; }

        /* Board of Directors Styles */
        .founder-top-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 45px;
        }
        .founder-prominent-card {
            background: linear-gradient(180deg, #1e293b 0%, #172033 100%);
            border-radius: 18px;
            padding: 42px 30px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            border: 2px solid var(--primary);
            box-shadow: 0 14px 35px rgba(0,0,0,0.5), 0 0 25px var(--primary-glow);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s;
        }
        .founder-prominent-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(56, 189, 248, 0.35);
        }
        .founder-badge {
            background: var(--primary);
            color: #0f172a;
            font-size: 11px;
            font-weight: 800;
            padding: 5px 16px;
            border-radius: 20px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .founder-prominent-card img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 18px;
            border: 4px solid var(--primary);
        }
        .founder-prominent-card h3 { 
            font-size: 25px; 
            font-weight: 800;
            letter-spacing: 0.6px;
            background: linear-gradient(135deg, #ffffff 15%, #cbd5e1 55%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px; 
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
        }
        .founder-prominent-card .quals { font-size: 13.5px; color: #94a3b8; margin-bottom: 8px; font-weight: 500; }
        .founder-prominent-card .role { font-size: 16px; color: var(--primary); font-weight: bold; margin-bottom: 14px; }
        .founder-prominent-card .desc { color: #cbd5e1; font-size: 14px; line-height: 1.6; }

        .directors-single-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }
        .director-card-sub {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 30px 18px;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s;
        }
        .director-card-sub:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 12px 30px var(--primary-glow);
        }
        .director-card-sub img {
            width: 135px;
            height: 135px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            border: 3px solid var(--primary);
        }
        .director-card-sub h3 { 
            font-size: 20px; 
            font-weight: 700;
            letter-spacing: 0.4px;
            background: linear-gradient(135deg, #ffffff 15%, #cbd5e1 60%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px; 
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
        }
        .director-card-sub .role { font-size: 13.5px; color: var(--primary); font-weight: bold; margin-bottom: 12px; line-height: 1.4; }
        .director-card-sub .desc { color: #cbd5e1; font-size: 13px; line-height: 1.55; }

        /* Careers, Portal & Contact Styles */
        .careers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .career-card { background: var(--card-bg); border-radius: 12px; padding: 30px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: 0.3s; position: relative; }
        .career-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .badge { display: inline-block; background: rgba(56, 189, 248, 0.15); color: var(--primary); font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--primary); margin-bottom: 12px; }
        .career-card h3 { font-size: 21px; color: var(--primary); margin-bottom: 8px; }
        .career-card .job-meta { font-size: 13px; color: #94a3b8; margin-bottom: 15px; font-weight: 500; }
        .career-card p { font-size: 14px; color: #cbd5e1; margin-bottom: 15px; }
        .career-card ul { list-style: disc; padding-left: 20px; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        .career-card ul li { margin-bottom: 5px; }
        .apply-btn { background: var(--primary); color: #0f172a; padding: 10px 22px; border-radius: 5px; font-size: 14px; font-weight: 700; text-decoration: none; display: inline-block; transition: 0.3s; }
        .apply-btn:hover { background: var(--primary-hover); }

        .portal-section { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; padding: 35px 25px; border-radius: 15px; max-width: 650px; margin: 0 auto; box-shadow: 0 15px 35px rgba(0,0,0,0.4); text-align: center; }
        .portal-form { display: flex; flex-direction: column; gap: 18px; }
        .form-group { text-align: left; }
        .form-group label { display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 8px var(--primary-glow); }
        .submit-btn { background: var(--primary); color: #0f172a; padding: 14px; border: none; border-radius: 6px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; width: 100%; }
        .submit-btn:hover { background: var(--primary-hover); }
        .success-banner { display: none; background: #065f46; color: #d1fae5; padding: 14px; border-radius: 6px; margin-bottom: 20px; font-weight: 600; font-size: 14px; }

        .payment-divider { margin: 30px 0 15px; border-top: 1px solid #334155; padding-top: 25px; }
        .upi-box { background: #020617; padding: 14px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 15px; font-size: 14px; color: #cbd5e1; word-break: break-all; }
        .upi-id { color: var(--primary); font-weight: bold; font-size: 16px; letter-spacing: 0.5px; }
        .payment-btn { background: #10b981; color: #fff; padding: 14px 20px; border-radius: 6px; font-size: 15px; font-weight: bold; text-decoration: none; display: inline-block; transition: 0.3s; width: 100%; text-align: center; }
        .payment-btn:hover { background: #059669; transform: translateY(-2px); }

        .contact-box { background: var(--card-bg); padding: 35px 25px; border-radius: 12px; max-width: 600px; margin: 0 auto; text-align: center; border: 1px solid #334155; }
        .contact-box p { font-size: 17px; margin-bottom: 12px; color: #cbd5e1; }
        .contact-box a { color: var(--primary); text-decoration: none; font-weight: bold; word-break: break-all; }

        footer { background: #020617; text-align: center; padding: 30px 5%; color: #94a3b8; border-top: 1px solid #1e293b; font-size: 13px; line-height: 1.8; }
        footer .footer-address { margin-bottom: 8px; font-size: 12px; color: #cbd5e1; }
        footer .footer-address span { color: var(--primary); font-weight: 600; }
        footer .copyright { margin-top: 12px; font-weight: 600; color: #94a3b8; font-size: 13px; }

        @media (max-width: 1024px) {
            .directors-single-row { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .top-bar { display: none; }
            nav { padding: 12px 4%; flex-direction: column; gap: 10px; }
            nav ul { gap: 10px; justify-content: center; font-size: 13px; }
            header { padding: 140px 15px 40px; }
            header h1 { font-size: 28px; }
            section { padding: 60px 4%; }
            .section-title { font-size: 26px; margin-bottom: 30px; }
            .founder-prominent-card { padding: 30px 20px; }
            .founder-prominent-card img { width: 150px; height: 150px; }
            .directors-single-row { grid-template-columns: 1fr; }
            .portal-section { padding: 25px 15px; }
        }
    </style>
</head>
